url: https://ayersant-sys.github.io/nepalallometry/

template:
  bootstrap: 5
  bslib:
    primary: "#1e6a46"
    bg: "#ffffff"
    fg: "#17211c"
    navbar-bg: "#123f2d"
    navbar-light-color: "#d7e7dd"
    navbar-light-hover-color: "#ffffff"
    navbar-light-active-color: "#ffffff"
    link-color: "#1e6a46"
    border-color: "#d9e2dc"
    code-bg: "#eef4f0"
  includes:
    in_header: |
      <meta name="theme-color" content="#123f2d">

home:
  title: nepalallometry
  description: >
    An extensible umbrella R package for transparent and reproducible allometric
    estimation for Nepal's forest trees, with separate workflows for biomass,
    carbon, and tree volume using published FRTC, Sharma and Pukkala, Chave,
    and Forest Regulations methods.
  sidebar:
    structure: [status, links, license, citation, authors]
    components:
      status:
        title: Package status
        text: |
          [![test-coverage](https://github.com/ayersant-sys/nepalallometry/actions/workflows/test-coverage.yaml/badge.svg)](https://github.com/ayersant-sys/nepalallometry/actions/workflows/test-coverage.yaml)
          [![R-CMD-check](https://github.com/ayersant-sys/nepalallometry/actions/workflows/r.yml/badge.svg)](https://github.com/ayersant-sys/nepalallometry/actions/workflows/r.yml)
          [![pkgdown](https://github.com/ayersant-sys/nepalallometry/actions/workflows/pkgdown.yaml/badge.svg)](https://github.com/ayersant-sys/nepalallometry/actions/workflows/pkgdown.yaml)
          [![release](https://img.shields.io/github/v/release/ayersant-sys/nepalallometry?label=release)](https://github.com/ayersant-sys/nepalallometry/releases/latest)
          [![DOI](https://zenodo.org/badge/DOI/10.5281/zenodo.22299266.svg)](https://doi.org/10.5281/zenodo.22299266)

navbar:
  structure:
    left: [intro, why, reference, articles, developer]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/frtc-inventory-workflow.html
    why:
      text: Why this package?
      href: articles/why-nepalallometry.html
    articles:
      text: Articles
      menu:
      - text: Biomass inventory workflow
        href: articles/frtc-inventory-workflow.html
      - text: Why nepalallometry?
        href: articles/why-nepalallometry.html
    developer:
      text: Developer
      href: articles/developer.html

reference:
- title: Biomass and carbon workflow
  desc: Estimate biomass and carbon and extract auditable inventory summaries.
  contents:
  - biomass
  - forest_summary
  - plot_summary
  - species_summary
  - dbh_summary
  - tree_results
  - method_audit
- title: Biomass pathways
  desc: Run individual published biomass methods.
  contents:
  - frtc_total_biomass
  - sharma_pukkala_biomass
  - chave_biomass
- title: Tree volume workflow
  desc: Estimate individual-tree or forest-inventory volume using supported published pathways.
  contents:
  - volume
  - frtc_volume
  - sharma_pukkala_volume
  - forest_regulation_branch_parameters
- title: Models, species, and sources
  desc: Inspect supported taxa, equations, density rules, and references.
  contents:
  - frtc_species
  - frtc_models
  - frtc_equation
  - frtc_density
  - sharma_pukkala_species
  - allometry_references
- title: FRTC compatibility workflow
  desc: Earlier FRTC-specific estimators and export functions.
  contents:
  - estimate_frtc_biomass
  - frtc_plot_summary
  - frtc_species_summary
  - frtc_dbh_summary
  - frtc_forest_summary
  - frtc_inventory_template
  - frtc_biomass_from_csv
  - biomass_from_csv

articles:
- title: Package guidance
  navbar: ~
  contents:
  - why-nepalallometry
  - frtc-inventory-workflow
  - developer

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: Developed by Santosh Ayer.

development:
  mode: auto
